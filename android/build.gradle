plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    namespace 'algorithmx.engage.rn'
    compileSdk safeExtGet('compileSdkVersion', 36)

    defaultConfig {
        // The native :android-sdk requires 24.
        minSdk Math.max(safeExtGet('minSdkVersion', 24), 24)
        targetSdk safeExtGet('targetSdkVersion', 36)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // React Native (version comes from the host app's React Native Gradle Plugin)
    implementation 'com.facebook.react:react-android'

    // The native AlgorithmX Android SDK. Apps get it from Maven Central; the SDK
    // monorepo's demo app includes the source module ':android-sdk' instead.
    // `api` lets the app's own native code (Application, FirebaseMessagingService)
    // call AlgorithmX without declaring the dependency itself.
    if (rootProject.findProject(':android-sdk') != null) {
        api project(':android-sdk')
    } else {
        api 'cloud.algorithmx:android-sdk:1.0.0'
    }

    implementation 'com.google.code.gson:gson:2.10.1'
}
